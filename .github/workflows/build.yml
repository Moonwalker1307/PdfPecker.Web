# Builds the web API and the website (the site is wwwroot), checks the Docker image starts and serves both, checks the
# Cloudflare Worker, and attaches the builds to a GitHub release. Deploy (deploy.yml) runs after this succeeds on main.
name: Build

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: jobs only read the repository; the release job alone may attach files to a release.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERSION_PREFIX: "1.0"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions are pinned to commits so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="${TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tag '$TAG' is not a version like v1.2.3 or 1.2.3-beta"
              exit 1
            fi
          else
            version="$VERSION_PREFIX.$GITHUB_RUN_NUMBER-preview"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        run: dotnet publish -c Release -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Build Docker image
        run: >
          docker build
          --build-arg VERSION=${{ steps.version.outputs.version }}
          -t pdfpecker-web:${{ steps.version.outputs.version }} .

      - name: Smoke test the image
        run: |
          docker run -d --name web -p 8080:8080 pdfpecker-web:${{ steps.version.outputs.version }}
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ -o /dev/null
          curl -fsS http://localhost:8080/html-to-pdf/ -o /dev/null
          curl -fsS http://localhost:8080/markdown/ -o /dev/null
          docker rm -f web

      - name: Package
        run: |
          (cd publish && zip -qr ../PdfPecker.Web.${{ steps.version.outputs.version }}.zip .)
          # The image is large, so it is only kept for releases.
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            docker save pdfpecker-web:${{ steps.version.outputs.version }} | gzip > pdfpecker-web.${{ steps.version.outputs.version }}.docker.tar.gz
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PdfPecker.Web.${{ steps.version.outputs.version }}
          path: |
            PdfPecker.Web.*.zip
            pdfpecker-web.*.docker.tar.gz
          if-no-files-found: error

  # Type-checks the Cloudflare Worker and checks wrangler.jsonc (the image itself is built and tested above).
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci
      - run: npx tsc
      - run: npx wrangler deploy --dry-run --containers-rollout=none

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PdfPecker.Web.${{ needs.build.outputs.version }}
          path: release

      - name: Attach builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/PdfPecker.Web.*.zip release/pdfpecker-web.*.docker.tar.gz --clobber

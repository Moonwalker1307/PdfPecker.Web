# Deploys pdfpecker.net to Cloudflare (the Worker in wrangler.jsonc and the container built from the Dockerfile) once
# the Build workflow has passed for a push to main. Run it by hand to redeploy main.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cut one off halfway: the next one waits.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pdfpecker.net
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the Build workflow tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      # The docs PDF is made here rather than checked in (each build differs: PDFs carry a random file ID).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          # The same package cache as the Build workflow, so PdfPecker is not downloaded from nuget.org again.
          cache: true
          cache-dependency-path: |
            PdfPecker.Web.csproj
            tools/DocsBuilder/DocsBuilder.csproj

      - name: Build the docs PDF
        run: dotnet run --project tools/DocsBuilder -c Release

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci

      # The runner's Docker cache starts empty, so the image gets the packages the docs builder restored instead of
      # downloading PdfPecker from nuget.org again (see nuget-seed/README.md).
      - name: Hand the restored packages to the Docker build
        run: cp -R ~/.nuget/packages/. nuget-seed/

      # Builds the image with the runner's Docker, pushes it to Cloudflare's registry, uploads the Worker and the page,
      # and rolls the container over to the new image.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the site
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://pdfpecker.net/health && exit 0
            sleep 10
          done
          echo "::error::https://pdfpecker.net/health did not answer"
          exit 1

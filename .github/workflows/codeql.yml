# Scans the web API (C#) and the site's scripts and the Worker (JavaScript and TypeScript) for security problems, on
# every pull request, after each merge and once a week, so new CodeQL queries also run against unchanged code.
# The repository is private and code scanning is not enabled for it, so the results are not uploaded: the job prints
# each finding and fails instead.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the repository is private, so CodeQL needs this to read its own workflow run
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          # The same package cache as the Build workflow, so PdfPecker is not downloaded from nuget.org again.
          cache: true
          cache-dependency-path: |
            PdfPecker.Web.csproj
            tools/DocsBuilder/DocsBuilder.csproj

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Third-party libraries the site serves as they were released (GrapesJS for the document designer).
          config: |
            paths-ignore:
              - wwwroot/*/vendor/**

      # Only the web app is analysed; the docs generator runs in CI, never on the server.
      - if: matrix.language == 'csharp'
        run: dotnet build -c Release PdfPecker.Web.csproj

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: codeql-results

      - name: Fail on findings
        run: |
          # The document designer parses the visitor's own HTML from its code view on purpose (DOMParser, inert), so
          # js/xss-through-dom is not counted there; every other query still is.
          filter='.runs[].results |= map(select((.ruleId == "js/xss-through-dom" and (.locations[0].physicalLocation.artifactLocation.uri | startswith("wwwroot/documentdesigner/"))) | not))'
          for f in codeql-results/*.sarif; do jq "$filter" "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          count=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          # Each finding as a plain line (the log keeps the file and line) and as an annotation on the pull request.
          jq -r '.runs[].results[] | (.locations[0].physicalLocation | "\(.artifactLocation.uri):\(.region.startLine)") as $at
            | "\($at) \(.ruleId): \(.message.text)", "::error file=\($at | split(":")[0]),line=\($at | split(":")[1])::\(.ruleId): \(.message.text)"' codeql-results/*.sarif
          echo "CodeQL findings: $count"
          [ "$count" -eq 0 ]

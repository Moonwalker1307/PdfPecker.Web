# Weekly pull requests when PdfPecker (used by the site and by the docs generator), a pinned GitHub Action, the Docker
# base images or the Worker's npm packages get a new version.
version: 2
updates:
  - package-ecosystem: nuget
    directories: [/, /tools/DocsBuilder]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL refuses to run when its init and analyze steps are on different versions, so they must move together.
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
